<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学生ロケット シミュレーター</title>
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>🚀 学生ロケット シミュレーター</h1>
  <div class="actions">
    <label class="btn spec-btn" id="lblSpecImport" title="団体入力シート形式の諸元表（.xlsx）を読み込む">諸元表読込（.xlsx）<input type="file" id="fileSpec" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden></label>
    <button id="btnSpecExport" class="spec-btn" title="現在の設定と計算結果を諸元表（.xlsx）に書き出す">諸元表書出し</button>
    <button id="btnDebug" class="spec-btn" title="Debug 機体の諸元表（サンプル）を読み込む">Debug 諸元</button>
    <button id="btnExport" title="設定をJSONで保存">設定保存</button>
    <label class="btn" title="JSONから設定を読込">設定読込<input type="file" id="fileImport" accept=".json,application/json" hidden></label>
    <button id="btnCsv" title="飛行データをCSVで保存">CSV</button>
    <button id="btnReset">初期値</button>
  </div>
</header>

<div class="layout">
  <aside id="panel"></aside>

  <main>
    <section class="card rocket-card">
      <canvas id="cvRocket"></canvas>
      <div id="staticInfo" class="kv"></div>
    </section>

    <div id="importPanel" class="card import-panel hide"></div>

    <div id="resultNote"></div>
    <section id="results" class="results"></section>
    <div id="warnings"></div>

    <details id="reviewCard" class="card review-card">
      <summary id="reviewSum">諸元表チェック</summary>
      <div id="review"></div>
    </details>

    <nav class="tabs">
      <button data-tab="3d" class="on">3D</button>
      <button data-tab="flight">飛行軌跡</button>
      <button data-tab="charts">グラフ</button>
      <button data-tab="mc">モンテカルロ</button>
      <button data-tab="disp">落下分散</button>
      <button data-tab="sweep">パラメータ掃引</button>
      <button data-tab="ekf">EKF</button>
      <button data-tab="verify">検算</button>
      <button data-tab="design">設計</button>
    </nav>

    <div id="playerCard" class="card player-card">
      <div class="player">
        <button id="btnPlay">▶ 再生</button>
        <select id="selSpeed" autocomplete="off">
          <option value="0.25">×¼</option><option value="1">×1</option><option value="3">×3</option>
          <option value="10" selected>×10</option><option value="30">×30</option>
        </select>
        <input type="range" id="scrub" min="0" max="1000" value="1000" step="0.01" aria-label="再生位置（秒）">
      </div>
      <div id="hud" class="hud"></div>
    </div>

    <section id="tab-3d" class="tab on">
      <div class="card">
        <div class="row v3d-bar">
          <label class="field"><span>カメラ</span>
            <select id="v3dCam" autocomplete="off">
              <option value="orbit">自由視点（ドラッグで回転・ホイールで拡大）</option>
              <option value="chase">追従（機体の後方から）</option>
              <option value="ground">射点から見上げ</option>
              <option value="onboard">機上カメラ（下向き）</option>
            </select>
          </label>
          <label class="field"><span>機体の表示倍率</span>
            <select id="v3dScale" autocomplete="off">
              <option value="auto" selected>自動（全体で見える大きさ）</option>
              <option value="1">実寸</option><option value="10">×10</option><option value="30">×30</option>
            </select>
          </label>
        </div>
        <div id="v3d" class="v3d"></div>
        <div class="muted small" id="v3dNote"></div>
      </div>
    </section>

    <section id="tab-flight" class="tab">
      <div class="card">
        <div class="row" style="justify-content:space-between"><div class="card-h">側面図（打上げ方位方向の距離 × 高度）</div><button id="btnKml" title="速度で色分けした軌道・イベント・追従ツアー">Google Earth 用 KML</button></div>
        <canvas id="cvSide" class="tall"></canvas>
      </div>
      <div class="card">
        <div class="card-h">上面図（北が上・風下へのドリフト）</div>
        <canvas id="cvTop" class="tall"></canvas>
      </div>
    </section>

    <section id="tab-charts" class="tab">
      <div id="charts" class="chart-grid"></div>
    </section>

    <section id="tab-mc" class="tab"></section>
    <section id="tab-ekf" class="tab"></section>
    <section id="tab-verify" class="tab"></section>
    <section id="tab-design" class="tab"></section>

    <section id="tab-sweep" class="tab">
      <div class="card">
        <div class="card-h">パラメータ掃引（1変数を振って性能の変化を見る）</div>
        <div class="fields mini">
          <label class="field"><span>変数</span><select id="swKey"></select></label>
          <label class="field"><span>開始</span><input type="number" id="swFrom" step="any"></label>
          <label class="field"><span>終了</span><input type="number" id="swTo" step="any"></label>
          <label class="field"><span>分割数</span><input type="number" id="swN" value="15" min="2" max="100"></label>
        </div>
        <div class="row"><button id="btnSweep" class="primary">実行</button><span id="swProg" class="muted"></span></div>
        <div id="swCharts" class="chart-grid"></div>
      </div>
    </section>

    <section id="tab-disp" class="tab">
      <div class="card"><div id="dispersion"></div></div>
    </section>

    <footer class="muted small">
      Barrowman 法（または諸元表の空力係数）と 6 自由度（並進3＋ピッチ/ヨー＋ロール）の数値積分による簡易モデルです。
      モータープリセットは公開仕様からの<b>近似値</b>です。実際の打上げ判断は OpenRocket / RockSim 等や実測値で必ず確認してください。
    </footer>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="geo.js"></script>
<script src="terrain.js"></script>
<script src="physics.js"></script>
<script src="specsheet.js"></script>
<script src="dispersion.js"></script>
<script src="analysis.js"></script>
<script src="verify.js"></script>
<script src="design.js"></script>
<script src="app.js"></script>
<script src="view3d.js"></script>
</body>
</html>

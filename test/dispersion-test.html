// physics.js v2 の関数がまだ無いときだけ、テスト専用の代替を入れる（本体は契約どおりの名前を裸の識別子で呼ぶ）
window.__shim = [];
if (typeof flightSummary !== 'function') {
  __shim.push('flightSummary');
  window.flightSummary = (M, s) => {
    const e = s.ev || {}, st = s.st || {}, N = NaN, apoT = e.apogee ? e.apogee.t : N, dt = d => d ? d.t - apoT : N;
    const pl = s.payload && s.payload.landing;
    return {
      apogee_m: st.apogee ?? N, apogee_t_s: st.apoT ?? N, railExit_V_mps: e.railExit ? e.railExit.V : N, railExit_alphaW_deg: e.railExit && e.railExit.alphaW != null ? e.railExit.alphaW : N,
      deploy1_dtApo_s: dt(e.deploy1), deploy2_dtApo_s: dt(e.deploy2), payload_dtApo_s: dt(e.payload),
      deploy1_Va_mps: e.deploy1 ? e.deploy1.V : N, deploy2_Va_mps: e.deploy2 ? e.deploy2.V : N, payload_Va_mps: e.payload ? e.payload.V : N,
      landing_t_s: e.landing ? e.landing.t : N, landing_V_mps: e.landing ? e.landing.V : N, landing_vz_mps: e.landing ? e.landing.vz : N,
      landing_dist_m: e.landing ? Math.hypot(e.landing.x, e.landing.y) : N,
      payloadLanding_dist_m: pl ? Math.hypot(pl.x, pl.y) : N, payloadLanding_vz_mps: pl ? pl.vz : N,
    };
  };
}
if (typeof enuToLatLon !== 'function') {
  __shim.push('enuToLatLon');
  window.enuToLatLon = (lat0, lon0, x, y) => [lat0 + y / RE * 180 / Math.PI, lon0 + x / (RE * Math.cos(lat0 * Math.PI / 180)) * 180 / Math.PI];
}
if (typeof normalizeCfg !== 'function') { __shim.push('normalizeCfg'); window.normalizeCfg = c => ({ ...c }); }
// app.js の代わり: cfg（let なので window には出ない）と download()
let cfg = normalizeCfg({});
window.__dl = [];
function download(name, text, type) { __dl.push({ name, text, type }); }

<script src="../dispersion.js"></script>
<script>
(async () => {
  const out = [], res = { pass: 0, fail: 0 };
  const ok = (name, cond, detail = '') => { if (cond) { res.pass++; out.push('PASS ' + name); } else { res.fail++; out.push('FAIL ' + name + (detail ? ' :: ' + detail : '')); } document.getElementById('result').textContent = out.join('\n') + '\n… running'; };
  const near = (a, b, tol) => Math.abs(a - b) <= tol;
  const show = () => { document.getElementById('result').textContent = out.join('\n') + `\n\nPASS ${res.pass} / FAIL ${res.fail}` + (__shim.length ? `\n（代替シム使用: ${__shim.join(', ')}）` : ''); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const useLeaflet = /leaflet=1/.test(location.search);
  try { localStorage.removeItem('student-rocket-sim:disp'); } catch (e) { }
  try {
    const D = window.Dispersion, T = D && D._test;
    // ---- モジュールの形 ----
    ok('window.Dispersion がある', !!D && ['mount', 'setVisible', 'markStale'].every(k => typeof D[k] === 'function'));
    const added = [...Object.getOwnPropertyNames(window)].filter(k => !__g1.has(k) && k !== '__g1');
    ok('dispersion.js が作る window のプロパティは Dispersion だけ', added.length === 1 && added[0] === 'Dispersion', added.join(','));
    const host = document.getElementById('dispersion');
    D.markStale(); D.setVisible(true); D.setVisible(false);
    ok('mount 前の markStale/setVisible は何もしない', host.childElementCount === 0 && !document.getElementById('disp-style'));

    // ---- 入力の解釈 ----
    ok('parseSpeeds: 0 を先頭に 1 点・昇順・重複なし', JSON.stringify(T.parseSpeeds('3, 1,2,2')) === '[0,1,2,3]');
    ok('parseSpeeds: 空欄は [0]', JSON.stringify(T.parseSpeeds('')) === '[0]');
    ok('parseSpeeds: 0・負値を除き全角も読む', JSON.stringify(T.parseSpeeds('0, 0.5 -1 ５')) === '[0,0.5,5]', JSON.stringify(T.parseSpeeds('0, 0.5 -1 ５')));
    ok('dirList 16/36', T.dirList(16).length === 16 && T.dirList(16)[1] === 22.5 && T.dirList(36)[35] === 350 && T.dirList(8)[7] === 315);
    ok('parseElevs: 空欄は設定値', JSON.stringify(T.parseElevs('', 85)) === '[85]' && JSON.stringify(T.parseElevs('80, 85,95', 85)) === '[80,85]');
    const pp = T.parsePolygon('35.1,140.1\n35.2, 140.1\n\n# memo\n35.2\t140.2\n35.1,140.1\nfoo');
    ok('parsePolygon: 閉じた点を落とし、読めない行を数える', pp.pts.length === 3 && pp.bad.length === 1 && pp.pts[1][0] === 35.2, JSON.stringify(pp));

    // ---- ENU と判定 ----
    const lat0 = 35.177228, lon0 = 140.357056;
    const ll = enuToLatLon(lat0, lon0, 1234.5, -567.8), e = T.toENU(lat0, lon0, ll[0], ll[1]);
    ok('toENU は enuToLatLon の逆変換（1e-6 m）', near(e[0], 1234.5, 1e-6) && near(e[1], -567.8, 1e-6), e.join(','));
    const zsC = T.prepZones([{ kind: 'include', shape: 'circle', lat: lat0, lon: lon0, r_m: 500 }], lat0, lon0);
    ok('円 include: 内側 OK・外側 NG', T.judgePoint(zsC, 0, 0, 0) === true && T.judgePoint(zsC, 0, 499, 0) === true && T.judgePoint(zsC, 0, 0, -501) === false);
    ok('円 include: margin 10 m', T.judgePoint(zsC, 10, 495, 0) === false && T.judgePoint(zsC, 10, 489, 0) === true);
    const zsX = T.prepZones([{ kind: 'include', shape: 'circle', lat: lat0, lon: lon0, r_m: 2000 }, { kind: 'exclude', shape: 'circle', ...(() => { const p = enuToLatLon(lat0, lon0, 1000, 0); return { lat: p[0], lon: p[1] }; })(), r_m: 200 }], lat0, lon0);
    ok('exclude: 中は NG、外は OK、margin で NG', T.judgePoint(zsX, 0, 1000, 100) === false && T.judgePoint(zsX, 0, 1000, 250) === true && T.judgePoint(zsX, 60, 1000, 250) === false);
    const sq = [[-1000, -1000], [1000, -1000], [1000, 1000], [-1000, 1000]].map(p => enuToLatLon(lat0, lon0, p[0], p[1]));
    const zsP = T.prepZones([{ kind: 'include', shape: 'polygon', pts: sq }], lat0, lon0);
    ok('多角形 include: ray casting と辺までの距離', T.judgePoint(zsP, 0, 0, 0) && T.judgePoint(zsP, 0, 999, 0) && !T.judgePoint(zsP, 5, 999, 0) && !T.judgePoint(zsP, 0, 1001, 0) && T.judgePoint(zsP, 5, 990, 990));
    const Lsh = [[0, 0], [2000, 0], [2000, 1000], [1000, 1000], [1000, 2000], [0, 2000]].map(p => enuToLatLon(lat0, lon0, p[0], p[1]));
    const zsL = T.prepZones([{ kind: 'include', shape: 'polygon', pts: Lsh }], lat0, lon0);
    ok('凹多角形（L 字）の内外', T.judgePoint(zsL, 0, 500, 1500) && T.judgePoint(zsL, 0, 1500, 500) && !T.judgePoint(zsL, 0, 1500, 1500));
    ok('多角形の符号付き距離', near(T.sdist(zsP[0], 900, 0), 100, 1e-3) && near(T.sdist(zsP[0], 1100, 0), -100, 1e-3));
    const zsE = T.prepZones([{ kind: 'exclude', shape: 'circle', lat: lat0, lon: lon0, r_m: 100 }], lat0, lon0);
    ok('exclude だけのとき、外側は OK（include 条件は空で真）', T.judgePoint(zsE, 0, 300, 0) === true && T.judgePoint(zsE, 0, 50, 0) === false);
    ok('zones が空なら null（判定しない）', T.judgePoint([], 0, 0, 0) === null);
    ok('非有限の着地点は NG', T.judgePoint(zsC, 0, NaN, 0) === false);

    // ---- Dispersion._geom（DOM に触れない純関数）----
    const G = D._geom;
    const gNames = ['pointInPolygon', 'distToPolygon', 'signedDist', 'zoneOk', 'allowFromMatrix', 'prepZones', 'toENU', 'toLL', 'downwindUnit'];
    ok('_geom の関数がそろう', !!G && gNames.every(k => typeof G[k] === 'function'), G ? gNames.filter(k => typeof G[k] !== 'function').join(',') : 'no _geom');
    const sqE = [[0, 0], [100, 0], [100, 100], [0, 100]];
    ok('pointInPolygon: 正方形の内外', G.pointInPolygon(sqE, 50, 50) && G.pointInPolygon(sqE, 1, 99) && !G.pointInPolygon(sqE, 150, 50) && !G.pointInPolygon(sqE, -1, 50) && !G.pointInPolygon(sqE, 50, 101) && !G.pointInPolygon(sqE, 50, -0.5));
    ok('pointInPolygon: 時計回り・閉じた点列でも同じ', G.pointInPolygon([...sqE].reverse(), 50, 50) && !G.pointInPolygon([...sqE].reverse(), 150, 50) && G.pointInPolygon([...sqE, sqE[0]], 50, 50) && !G.pointInPolygon([...sqE, sqE[0]], 150, 50));
    const Lp = [[0, 0], [200, 0], [200, 100], [100, 100], [100, 200], [0, 200]];
    ok('pointInPolygon: 凹多角形（L 字）の切欠きは外', G.pointInPolygon(Lp, 50, 150) && G.pointInPolygon(Lp, 150, 50) && !G.pointInPolygon(Lp, 150, 150) && !G.pointInPolygon(Lp, 250, 50));
    const dia = [[0, 0], [100, 50], [0, 100], [-100, 50]];
    ok('pointInPolygon: レイが頂点を通る（菱形の中心高さ）', G.pointInPolygon(dia, 0, 50) && G.pointInPolygon(dia, 90, 50) && !G.pointInPolygon(dia, 150, 50) && !G.pointInPolygon(dia, -150, 50));
    const tri = [[0, 0], [300, 0], [0, 300]];
    ok('pointInPolygon: 斜辺の両側', G.pointInPolygon(tri, 100, 190) && !G.pointInPolygon(tri, 100, 210));
    ok('distToPolygon: 辺・頂点までの最短距離（内外とも非負）', near(G.distToPolygon(sqE, 50, 40), 40, 1e-9) && near(G.distToPolygon(sqE, 130, 50), 30, 1e-9) && near(G.distToPolygon(sqE, 103, 104), 5, 1e-9) && near(G.distToPolygon(sqE, 50, 0), 0, 1e-9),
      [G.distToPolygon(sqE, 50, 40), G.distToPolygon(sqE, 130, 50), G.distToPolygon(sqE, 103, 104)].join(','));
    ok('distToPolygon: 閉じる辺（最後→最初）も見る', near(G.distToPolygon(sqE, -7, 50), 7, 1e-9) && near(G.distToPolygon(tri, 100, 210), 10 / Math.SQRT2, 1e-9));
    ok('distToPolygon: 凹部の角（内側は頂点まで・切欠き側は辺まで）', near(G.distToPolygon(Lp, 90, 90), Math.hypot(10, 10), 1e-9) && near(G.distToPolygon(Lp, 110, 110), 10, 1e-9) && near(G.distToPolygon(Lp, 90, 150), 10, 1e-9), [G.distToPolygon(Lp, 90, 90), G.distToPolygon(Lp, 110, 110), G.distToPolygon(Lp, 90, 150)].join(','));
    ok('signedDist: 円と多角形（内側が正）', near(G.signedDist({ shape: 'circle', c: [10, 0], r: 50 }, 10, 20), 30, 1e-9) && near(G.signedDist({ shape: 'circle', c: [0, 0], r: 50 }, 80, 0), -30, 1e-9)
      && near(G.signedDist({ shape: 'polygon', p: sqE }, 50, 90), 10, 1e-9) && near(G.signedDist({ shape: 'polygon', p: sqE }, 50, 110), -10, 1e-9));
    const zI = { kind: 'include', shape: 'polygon', p: sqE }, zX = { kind: 'exclude', shape: 'circle', c: [50, 50], r: 10 };
    ok('zoneOk: include の中で exclude の外だけ OK', G.zoneOk([zI, zX], 0, 20, 20) === true && G.zoneOk([zI, zX], 0, 55, 50) === false && G.zoneOk([zI, zX], 0, 120, 50) === false);
    ok('zoneOk: margin は include の内側・exclude の外側の両方に効く', G.zoneOk([zI, zX], 15, 10, 50) === false && G.zoneOk([zI, zX], 15, 72, 50) === false && G.zoneOk([zI, zX], 15, 80, 50) === true && G.zoneOk([zI, zX], 15, 20, 20) === true);
    ok('zoneOk: margin ちょうどは OK（境界を含む）', G.zoneOk([zI], 15, 15, 50) === true && G.zoneOk([zI], 15, 14.999, 50) === false);
    ok('zoneOk: include が複数ならどれか 1 つの内側で OK', G.zoneOk([zI, { kind: 'include', shape: 'circle', c: [500, 0], r: 50 }], 0, 500, 0) === true && G.zoneOk([zI, { kind: 'include', shape: 'circle', c: [500, 0], r: 50 }], 0, 300, 0) === false);
    ok('zoneOk: exclude が複数なら全部の外側', G.zoneOk([zI, zX, { kind: 'exclude', shape: 'polygon', p: [[0, 0], [30, 0], [30, 30], [0, 30]] }], 0, 20, 20) === false && G.zoneOk([zI, zX, { kind: 'exclude', shape: 'polygon', p: [[0, 0], [30, 0], [30, 30], [0, 30]] }], 0, 80, 20) === true);
    ok('zoneOk: zones 空は null・非有限は NG・負の margin は 0 扱い', G.zoneOk([], 0, 1, 1) === null && G.zoneOk([zI], 0, Infinity, 1) === false && G.zoneOk([zI], -50, 50, 120) === false);
    // allowFromMatrix: 行 = 風速（昇順・先頭 0 m/s は 1 列）、列 = 風向
    const spA = [0, 2, 4, 6];
    const A1 = G.allowFromMatrix([[true], [true, true, false], [true, false, true], [false, true, true]], spA);
    ok('allowFromMatrix: 「その風速以下が全部 OK」の最大（途中の NG で打切り）', JSON.stringify(A1.allow.map(a => a.v)) === '[4,2,0]' && JSON.stringify(A1.allow.map(a => a.lim)) === '[3,2,1]' && A1.all === 0, JSON.stringify(A1));
    const A2 = G.allowFromMatrix([[true, true], [true, true], [true, true], [true, true]], spA);
    ok('allowFromMatrix: 全 OK なら最大風速・lim=null', A2.allow.every(a => a.v === 6 && a.lim === null) && A2.all === 6, JSON.stringify(A2));
    const A3 = G.allowFromMatrix([[false], [true, true], [true, true], [true, true]], spA, 2);
    ok('allowFromMatrix: 0 m/s が NG なら打上げ不可（v=null, all=null）', A3.allow.length === 2 && A3.allow.every(a => a.v === null && a.lim === 0) && A3.all === null, JSON.stringify(A3));
    const A4 = G.allowFromMatrix([[true, true, true], [true, null, true], [true, true, true], [true, true, true]], spA);
    ok('allowFromMatrix: true 以外（null 等）は NG・0 m/s の行は全列でもよい', JSON.stringify(A4.allow.map(a => a.v)) === '[6,0,6]' && A4.all === 0, JSON.stringify(A4));
    // ENU ヘルパー
    const rtrip = [[35.177228, 140.357056, 1234.5, -567.8], [60, 10, -3000, 2500], [-40, -70, 50, 50]].every(([a, b, x, y]) => { const p = G.toLL(a, b, x, y), q2 = G.toENU(a, b, p[0], p[1]); return near(q2[0], x, 1e-6) && near(q2[1], y, 1e-6); });
    ok('toENU / toLL の往復（35°・60°・南緯 40°）', rtrip);
    const e1 = G.toENU(35, 140, 35.001, 140), e2 = G.toENU(60, 0, 60, 0.002);
    const ex1 = latLonToEnu(35, 140, 35.001, 140), ex2 = latLonToEnu(60, 0, 60, 0.002);
    ok('toENU は physics の latLonToEnu（楕円体の曲率半径）と同じ', near(e1[0], ex1[0], 1e-9) && near(e1[1], ex1[1], 1e-9) && near(e2[0], ex2[0], 1e-9) && near(e2[1], ex2[1], 1e-9), `${e1} / ${e2}`);
    const llS = G.toLL(35, 140, 0, 1000);
    ok('toLL は契約の enuToLatLon と同じ式', near(llS[0], enuToLatLon(35, 140, 0, 1000)[0], 1e-12) && near(llS[1], 140, 1e-12));
    const dw = f => G.downwindUnit(f).map(v => Math.round(v * 1e9) / 1e9 + 0);
    ok('downwindUnit: 吹いてくる方位の反対へ流れる単位ベクトル [東, 北]', JSON.stringify(dw(270)) === '[1,0]' && JSON.stringify(dw(0)) === '[0,-1]' && JSON.stringify(dw(90)) === '[-1,0]' && JSON.stringify(dw(180)) === '[0,1]' && near(Math.hypot(...G.downwindUnit(33)), 1, 1e-12), JSON.stringify([dw(270), dw(0), dw(90), dw(180)]));
    const pz = G.prepZones([{ kind: 'include', shape: 'circle', lat: 35.001, lon: 140, r_m: 300 }, { kind: 'exclude', shape: 'polygon', pts: [[35, 140], [35.001, 140], [35, 140.001]] }], 35, 140);
    ok('prepZones: 円は中心を ENU に・多角形は各点を ENU に', pz[0].shape === 'circle' && pz[0].r === 300 && near(pz[0].c[1], e1[1], 1e-9) && pz[1].p.length === 3 && near(pz[1].p[0][0], 0, 1e-9) && near(pz[1].p[2][0], G.toENU(35, 140, 35, 140.001)[0], 1e-9) && pz[1].kind === 'exclude');

    // ---- mount と DOM ----
    if (!useLeaflet) T.disableLeaflet();
    D.mount(host);
    const n1 = host.innerHTML.length;
    D.mount(host); D.mount(document.body);
    ok('mount は 1 回目だけ UI を作る', host.innerHTML.length === n1 && document.querySelectorAll('#disp-style').length === 1 && host.querySelector('.disp-go'));
    const rules = [...document.getElementById('disp-style').sheet.cssRules];
    const sels = rules.flatMap(r => (r.selectorText || '').split(','));
    ok('CSS セレクタはすべて #dispersion で始まる', sels.length > 10 && sels.every(s => s.trim().startsWith('#dispersion ')), sels.filter(s => !s.trim().startsWith('#dispersion ')).join(' | '));
    const css = T.css();
    ok('必須 CSS: .disp-map の高さ', /#dispersion \.disp-map\{height:min\(60vh,520px\)/.test(css));
    ok('必須 CSS: leaflet canvas / control input / 代替 canvas の高さ', css.includes('#dispersion .leaflet-container canvas{width:auto;height:auto}') && css.includes('#dispersion .leaflet-control input{width:auto}') && /#dispersion canvas\.disp-cv\{[^}]*height:min\(60vh,520px\)/.test(css));
    const okCls = new Set(['card', 'card-h', 'fields', 'mini', 'field', 'row', 'primary', 'muted', 'small', 'kv']);
    const cls = [...new Set([...host.querySelectorAll('[class]')].flatMap(el => [...el.classList]))];
    ok('クラス名は disp-* か既存クラスだけ', cls.every(c => c.startsWith('disp-') || okCls.has(c)), cls.filter(c => !c.startsWith('disp-') && !okCls.has(c)).join(','));
    ok('UI 文言は日本語（実行・中止・風速リスト）', /実行/.test(host.textContent) && /中止/.test(host.textContent) && /風速リスト/.test(host.textContent) && /許可域/.test(host.textContent));
    const sp = host.querySelector('[data-k="speeds"]'); sp.value = '2,4'; sp.dispatchEvent(new Event('change', { bubbles: true }));
    const nd = host.querySelector('[data-k="nDir"]'); nd.value = '8'; nd.dispatchEvent(new Event('change', { bubbles: true }));
    let saved = {}; try { saved = JSON.parse(localStorage.getItem('student-rocket-sim:disp') || '{}'); } catch (e) { }
    ok('入力を localStorage student-rocket-sim:disp に保存', saved.speeds === '2,4' && saved.nDir === 8, JSON.stringify(saved));
    ok('風向の基準を cfg.windDirRef に合わせて表示', /真北/.test(host.querySelector('.disp-dirref').textContent));
    ok('payloadOn=false ならペイロード対象は無効', host.querySelector('[data-k="tPay"]').disabled === true);
    const lfTags = () => [document.querySelectorAll('script[src*="leaflet"]').length, document.querySelectorAll('link[href*="leaflet"]').length];
    ok('mount だけでは Leaflet を読まない', lfTags().join() === '0,0' && !T.leafletState().loading, lfTags().join());
    D.setVisible(true);
    if (useLeaflet) ok('最初の setVisible(true) で Leaflet の JS と CSS を 1 回だけ読む（1.9.4・cdnjs）', lfTags().join() === '1,1' && document.querySelector('script[src*="leaflet"]').src === 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js' && document.querySelector('link[href*="leaflet"]').href === 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css', lfTags().join());
    D.setVisible(false); D.setVisible(true);
    if (useLeaflet) ok('2 回目の setVisible(true) では読み直さない', lfTags().join() === '1,1', lfTags().join());
    ok('風速の色はグラデーション（0 m/s は白、風速ごとに違う色）', T.spdCol(0, 4) === '#e6ecf8' && new Set([1, 2, 3].map(i => T.spdCol(i, 4))).size === 3 && /^#[0-9a-f]{6}$/.test(T.spdCol(3, 4)), [0, 1, 2, 3].map(i => T.spdCol(i, 4)).join(','));

    // ---- 計算（無風 + 2,4 m/s × 8 方位、弾道＋減速） ----
    const t0 = performance.now();
    await T.run();
    const R = T.result();
    ok('計算が終わる', !!R && !T.isBusy(), host.querySelector('.disp-msg').textContent);

      if (mk) { const b = mk.getBoundingClientRect(); mk.dispatchEvent(new MouseEvent('mouseover', { bubbles: true, clientX: b.left + b.width / 2, clientY: b.top + b.height / 2 })); }
      await wait(50);
      const tt = host.querySelector('.leaflet-tooltip');
      ok('Leaflet: 点にカーソルを当てるとツールチップ', !!tt && /m\/s/.test(tt.textContent) && /距離/.test(tt.textContent), tt ? tt.textContent : 'tooltip なし');
      ok('Leaflet: 凡例を地図に重ねる', !host.querySelector('.disp-legend').classList.contains('disp-hide') && /減速落下/.test(host.querySelector('.disp-legend').textContent));
      D.setVisible(false); host.querySelector('.disp-mapwrap').style.width = '400px'; D.setVisible(true);
      // ヘッドレス（仮想時間）では requestAnimationFrame が回らない。dispersion.js は 250 ms のタイマーでも invalidateSize する
      await wait(400);
      const pane = host.querySelector('.leaflet-container');
      const sz = T.leafletState().size;
      ok('Leaflet: 再表示で invalidateSize（地図の内部サイズが新しい幅に追従）', !!pane && !!sz && Math.abs(sz[0] - pane.clientWidth) <= 1 && Math.abs(pane.clientWidth - 400) <= 2, pane && `${pane.clientWidth} / ${sz}`);
      host.querySelector('.disp-mapwrap').style.width = '';
    }
  } catch (e) {
    ok('例外なし', false, e && (e.stack || e.message || e));
  }
  show();
})();
</script>
</body>
</html>
